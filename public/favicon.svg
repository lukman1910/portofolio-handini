<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#0f172a" />
      <stop offset="50%" stopColor="#1e1b4b" />
      <stop offset="100%" stopColor="#09090b" />
    </linearGradient>
    <linearGradient id="hGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#38bdf8" />
      <stop offset="50%" stopColor="#818cf8" />
      <stop offset="100%" stopColor="#c084fc" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#38bdf8" stopOpacity="0.8" />
      <stop offset="100%" stopColor="#c084fc" stopOpacity="0.4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Rounded Container -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="2.5" />

  <!-- Ambient Glow Behind H -->
  <circle cx="32" cy="32" r="16" fill="#818cf8" opacity="0.25" filter="url(#glow)" />

  <!-- Monogram Letter H -->
  <g fill="url(#hGrad)">
    <!-- Left Pillar -->
    <rect x="15" y="14" width="9" height="36" rx="4.5" />
    <!-- Right Pillar -->
    <rect x="40" y="14" width="9" height="36" rx="4.5" />
    <!-- Center Crossbar -->
    <rect x="20" y="27.5" width="24" height="9" rx="3.5" />
  </g>

  <!-- Accent Dot (Cyber Neon Detail) -->
  <circle cx="49" cy="15" r="2.5" fill="#34d399" />
</svg>